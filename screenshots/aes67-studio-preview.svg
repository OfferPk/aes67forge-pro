<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162032" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g stroke="#1f2937" stroke-width="1" opacity="0.5">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="80" fill="#111827" stroke="#2b394f" stroke-width="1" />
  <rect x="30" y="20" width="40" height="40" rx="8" fill="url(#brandGrad)" />
  <text x="50" y="46" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">AO</text>
  <text x="85" y="42" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">AES67Forge Pro</text>
  <text x="245" y="42" fill="#94a3b8" font-family="sans-serif" font-size="12">v1.0.0</text>
  <text x="85" y="58" fill="#06b6d4" font-family="monospace" font-size="11">BROADCAST AUDIO-OVER-IP ENGINEERING &amp; PTP TIMING STUDIO</text>

  <!-- Status pill -->
  <rect x="920" y="26" width="250" height="28" rx="14" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1" />
  <circle cx="938" cy="40" r="4" fill="#10b981" />
  <text x="950" y="44" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">PTP LOCKED (IEEE 1588-2008)</text>

  <!-- Navigation Bar -->
  <rect x="0" y="80" width="1200" height="45" fill="#111827" stroke="#2b394f" stroke-width="1" />
  <text x="40" y="108" fill="#06b6d4" font-family="sans-serif" font-size="13" font-weight="bold">STREAM SIZER &amp; BANDWIDTH</text>
  <line x1="35" y1="124" x2="245" y2="124" stroke="#06b6d4" stroke-width="2" />
  <text x="280" y="108" fill="#9ca3af" font-family="sans-serif" font-size="13">SDP CODEC</text>
  <text x="400" y="108" fill="#9ca3af" font-family="sans-serif" font-size="13">RTP &amp; HEX INSPECTOR</text>
  <text x="580" y="108" fill="#9ca3af" font-family="sans-serif" font-size="13">PTP TIMING &amp; BMCA</text>
  <text x="750" y="108" fill="#9ca3af" font-family="sans-serif" font-size="13">WAVEFORM CANVAS</text>
  <text x="930" y="108" fill="#9ca3af" font-family="sans-serif" font-size="13">NORMATIVE AUDITOR (10-PT)</text>

  <!-- Main Grid Area -->
  <!-- Left Card: Config -->
  <rect x="40" y="155" width="540" height="480" rx="12" fill="url(#cardGrad)" stroke="#2b394f" stroke-width="1" />
  <text x="65" y="195" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Stream Sizer &amp; Packaging</text>

  <!-- Input Row 1 -->
  <rect x="65" y="225" width="490" height="45" rx="6" fill="#1f2937" stroke="#2b394f" stroke-width="1" />
  <text x="80" y="252" fill="#f3f4f6" font-family="sans-serif" font-size="14">Channels: 2 (Stereo Pair)</text>

  <!-- Input Row 2 -->
  <rect x="65" y="285" width="490" height="45" rx="6" fill="#1f2937" stroke="#2b394f" stroke-width="1" />
  <text x="80" y="312" fill="#f3f4f6" font-family="sans-serif" font-size="14">Sample Rate: 48,000 Hz (Mandatory Standard)</text>

  <!-- Input Row 3 -->
  <rect x="65" y="345" width="490" height="45" rx="6" fill="#1f2937" stroke="#2b394f" stroke-width="1" />
  <text x="80" y="372" fill="#f3f4f6" font-family="sans-serif" font-size="14">Bit Depth: 24-bit L24 Linear PCM</text>

  <!-- Input Row 4 -->
  <rect x="65" y="405" width="490" height="45" rx="6" fill="#1f2937" stroke="#2b394f" stroke-width="1" />
  <text x="80" y="432" fill="#f3f4f6" font-family="sans-serif" font-size="14">Packet Time (ptime): 1.0 ms (Baseline Profile)</text>

  <!-- Button -->
  <rect x="65" y="475" width="490" height="48" rx="6" fill="url(#brandGrad)" />
  <text x="310" y="505" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Recalculate Stream Metrics</text>

  <!-- Left Stat Summary -->
  <rect x="65" y="545" width="490" height="65" rx="6" fill="#0d131f" stroke="#2b394f" stroke-width="1" />
  <text x="80" y="570" fill="#9ca3af" font-family="monospace" font-size="11">SDP CLOCK REF</text>
  <text x="80" y="592" fill="#06b6d4" font-family="monospace" font-size="13">a=ts-refclk:ptp=IEEE1588-2008:00-11-22-FF-FE-33-44-55:0</text>

  <!-- Right Card: Metrics & Scope -->
  <rect x="620" y="155" width="540" height="480" rx="12" fill="url(#cardGrad)" stroke="#2b394f" stroke-width="1" />
  <text x="645" y="195" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Transmission &amp; Bandwidth Analysis</text>

  <!-- Metric 1 -->
  <rect x="645" y="225" width="235" height="95" rx="8" fill="#0d131f" stroke="#2b394f" stroke-width="1" />
  <text x="660" y="250" fill="#9ca3af" font-family="monospace" font-size="11">TOTAL WIRE BITRATE</text>
  <text x="660" y="285" fill="#06b6d4" font-family="sans-serif" font-size="26" font-weight="bold">2.624 Mbps</text>
  <text x="660" y="305" fill="#64748b" font-family="sans-serif" font-size="11">IP + UDP + RTP + Payload</text>

  <!-- Metric 2 -->
  <rect x="900" y="225" width="235" height="95" rx="8" fill="#0d131f" stroke="#2b394f" stroke-width="1" />
  <text x="915" y="250" fill="#9ca3af" font-family="monospace" font-size="11">PAYLOAD BITRATE</text>
  <text x="915" y="285" fill="#10b981" font-family="sans-serif" font-size="26" font-weight="bold">2.304 Mbps</text>
  <text x="915" y="305" fill="#64748b" font-family="sans-serif" font-size="11">Pure L24 Audio Stream</text>

  <!-- Metric 3 -->
  <rect x="645" y="335" width="235" height="95" rx="8" fill="#0d131f" stroke="#2b394f" stroke-width="1" />
  <text x="660" y="360" fill="#9ca3af" font-family="monospace" font-size="11">PACKET RATE</text>
  <text x="660" y="395" fill="#f59e0b" font-family="sans-serif" font-size="26" font-weight="bold">1,000 pkts/s</text>
  <text x="660" y="415" fill="#64748b" font-family="sans-serif" font-size="11">1.0 ms transmission slot</text>

  <!-- Metric 4 -->
  <rect x="900" y="335" width="235" height="95" rx="8" fill="#0d131f" stroke="#2b394f" stroke-width="1" />
  <text x="915" y="360" fill="#9ca3af" font-family="monospace" font-size="11">PAYLOAD SIZE</text>
  <text x="915" y="395" fill="#3b82f6" font-family="sans-serif" font-size="26" font-weight="bold">288 Bytes</text>
  <text x="915" y="415" fill="#64748b" font-family="sans-serif" font-size="11">48 samples/ch × 2ch × 3B</text>

  <!-- Waveform simulation canvas display -->
  <rect x="645" y="445" width="490" height="165" rx="8" fill="#0a0e17" stroke="#2b394f" stroke-width="1" />
  <path d="M 655 525 Q 715 470 775 525 T 895 525 T 1015 525 T 1125 525" fill="none" stroke="#06b6d4" stroke-width="2.5" />
  <path d="M 655 525 Q 715 560 775 525 T 895 525 T 1015 525 T 1125 525" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" />
  <text x="665" y="470" fill="#9ca3af" font-family="monospace" font-size="11">AUDIO WAVE &amp; JITTER BUFFER DEPTH (48 kHz L24)</text>
  <line x1="780" y1="485" x2="780" y2="595" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="960" y1="485" x2="960" y2="595" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="790" y="580" fill="#f59e0b" font-family="monospace" font-size="10">Jitter Bound: ±0.4ms</text>
</svg>
